<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>跟著老殘遊明湖</title>
<style>
/* 全螢幕 3D 畫面，上面疊一層古風介面 */
:root{--paper:#f4ecd8;--ink:#2f2a24;--muted:#6b5d4b;--seal:#b23a2a;--panel:rgba(250,244,230,.93);--line:#c9b48c;color-scheme:light}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe0e6;color:var(--ink);font-family:"PingFang TC","Noto Serif TC","Songti TC",serif;-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:15px;box-shadow:0 2px 8px #0002}
.chip b{color:var(--seal)}
.title{font-size:18px;letter-spacing:2px}
.label{position:fixed;transform:translate(-50%,-100%);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:14px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px #0003}
.label.done{color:var(--muted)}
.label.done::after{content:" ✓";color:var(--seal)}
.label.next{border-color:var(--seal);color:var(--seal);font-weight:700}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--seal);color:#fff;padding:10px 20px;border-radius:6px;font-size:18px;box-shadow:0 4px 12px #0004;transition:opacity .4s;opacity:0;pointer-events:none}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,52,50,.45)}
#start .card{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:22px 26px;max-width:min(420px,calc(100% - 40px));text-align:center;box-shadow:0 6px 24px #0005}
#start h1{margin:0 0 6px;font-size:28px;letter-spacing:4px}
#start p{margin:8px 0;font-size:16px;line-height:1.6;color:var(--muted)}
#go{margin-top:10px;font:inherit;font-size:18px;padding:10px 28px;border-radius:6px;border:none;background:var(--seal);color:#fff;cursor:pointer}
#go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.sb{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.sb span{width:10px;height:14px;background:#e3d8bf;border:1px solid var(--line)}
.sb span.on{background:linear-gradient(#5a9a8a,#2f6a86)}
.hud{z-index:10}
#vn{position:fixed;inset:0;z-index:5;opacity:0;transition:opacity .6s;background:#2d3a35;overflow:hidden}
#vn.on{opacity:1}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s,filter 1s,transform-origin 1.8s ease;animation:kb 28s ease-in-out infinite alternate;will-change:transform}
.bg.in{opacity:1}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.1) translate(-1.2%,-1%)}}
.bg.tall{animation:none;transform:scale(1.55);transform-origin:50% 18%}
.bg.tall.down{transform:scale(1);transform-origin:50% 50%}
.bg{transition:opacity .9s,filter 1s,transform 2.4s ease,transform-origin 1.8s ease}
#fxc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}
#fxc.tall{transform:scale(1.55);transform-origin:50% 18%}
#vn.clear{background:transparent;pointer-events:none}
#vn.clear #dlg{pointer-events:auto}
#vn.clear .bg,#vn.clear #fxc,#vn.clear #sunset,#vn.clear #actor{display:none}
#pad{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
#pad button{font:inherit;font-size:22px;border-radius:12px;border:2px solid var(--line);background:rgba(250,244,230,.88);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
#pad button:active{background:var(--seal);color:#fff}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
body.vn #pad{display:none}
#compass svg{transition:transform .15s linear}
@media (max-width:600px){#pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}}
#sunset{position:absolute;inset:0;background:linear-gradient(rgba(255,135,80,.6),rgba(255,120,150,.5));mix-blend-mode:multiply;opacity:0;transition:opacity .25s;pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none}
#fx.shine{background:radial-gradient(circle at 50% 35%,rgba(255,250,220,.55),transparent 60%);animation:shine 1.6s ease-out forwards}
@keyframes shine{from{opacity:1}to{opacity:0}}
#fx.ripple{background:repeating-linear-gradient(0deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.12) 15px 16px);animation:rip 3s linear infinite;mask-image:linear-gradient(transparent 45%,#000 70%);-webkit-mask-image:linear-gradient(transparent 45%,#000 70%)}
@keyframes rip{from{background-position:0 0}to{background-position:0 64px}}
#actor{position:absolute;bottom:0;right:3%;height:min(80vh,640px);aspect-ratio:340/900;background-size:contain;background-repeat:no-repeat;background-position:bottom center;opacity:0;transform:translateY(6%);transition:opacity .35s,transform .35s;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));pointer-events:auto}
#actor.show{opacity:1;transform:none}
#actor.left{right:auto;left:3%}
#dlg.asking{cursor:default}
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(860px,calc(100% - 24px));max-height:calc(100% - 84px - env(safe-area-inset-bottom,0px));overflow:auto;background:rgba(250,244,230,.94);border:2px solid var(--line);border-radius:10px;padding:10px 16px 10px;box-shadow:0 6px 20px rgba(0,0,0,.35);box-sizing:border-box;z-index:3;cursor:pointer}
#who{font-weight:700;color:var(--seal);font-size:17px;flex:1}
#txt{font-size:21px;line-height:1.65;margin-top:4px}
#more{text-align:right;font-size:13px;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;min-height:28px}
#face{width:46px;height:46px;border-radius:50%;flex:none;background-color:#e8dcc0;background-size:260%;background-position:50% 2%;background-repeat:no-repeat;border:2px solid var(--line)}
#textBtn{font:inherit;font-size:14px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);cursor:pointer}
#quote{font-size:14px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qt{background:#efe2c4;border-radius:10px;padding:1px 8px}
.src{color:var(--muted)}
.peek{font:inherit;font-size:14px;padding:3px 10px;border-radius:12px;border:1px dashed var(--seal);background:transparent;color:var(--seal);cursor:pointer}
#txt b.ok{color:#2f7a4a;margin-right:6px}
.tip{color:var(--seal);font-size:17px}
.pink{color:#d0607a}
mark{background:linear-gradient(transparent 55%,#f4c96a 55%);color:inherit;font-weight:700}
#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-top:8px}
#choices:has(.tile){grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.opt,.go{font:inherit;font-size:18px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:#fffaf0;color:var(--ink);cursor:pointer;text-align:left}
.tile{text-align:center;font-size:22px;font-weight:700}
.opt.right{border-color:#2f7a4a;background:#e3f2e3}
.opt.wrong{border-color:var(--seal);background:#f6e0da;color:var(--muted);text-decoration:line-through}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.go{grid-column:1/-1;text-align:center;background:var(--seal);color:#fff;border-color:var(--seal)}
.opt:focus-visible,.go:focus-visible,#textBtn:focus-visible,.peek:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.couplet{display:block;text-align:center;margin:8px 0}
.couplet span{display:inline-block;vertical-align:top;margin:0 14px;line-height:1.25;background:#a8322a;color:#f6e3b4;padding:10px 10px;font-size:24px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.couplet span i,.couplet span b{display:block;font-style:normal}
.couplet .blank{color:#ffe08a;font-weight:700}
.couplet.one{writing-mode:horizontal-tb;background:#a8322a;color:#f6e3b4;padding:8px 14px;font-size:22px;letter-spacing:3px;border-radius:3px;width:fit-content;margin:8px auto}
.colors,.route{margin-top:6px;font-size:20px;line-height:1.8}
.colors span.now{background:#fff1c9;border-radius:6px;padding:0 4px}
.colors b,.route .got{color:var(--seal)}
.route span{display:inline-block;min-width:2.5em;text-align:center;border-bottom:2px solid var(--line);margin:0 2px}
.sun{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:18px}
.sun input{flex:1;min-width:0;height:30px}
.cnt{grid-column:1/-1;font-size:20px;text-align:center}
#field{position:absolute;inset:0;z-index:4}
.lbar{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(250,244,230,.95);border:2px solid var(--line);border-radius:20px;padding:8px 22px;font-size:22px;white-space:nowrap}
.lbar b{color:var(--seal)}
.pod.got{transform:scale(1.6);opacity:0;transition:.25s}
.pod.demo{position:static;display:inline-block;width:38px;height:38px;margin:0;animation:none;vertical-align:middle;cursor:default}
.pod{position:absolute;top:100%;width:86px;height:86px;margin-left:-43px;border-radius:50%;border:3px solid #5b5a2a;background:radial-gradient(circle at 30% 35%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle at 62% 30%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle at 48% 62%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle at 72% 64%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle,#b6b05a,#7f8a3a);animation:hop linear forwards;cursor:pointer;padding:0}
@keyframes hop{0%{top:100%;transform:rotate(0)}50%{top:18%}100%{top:105%;transform:rotate(200deg)}}
#routeMap{position:fixed;inset:0;z-index:8;background:rgba(40,52,50,.55);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px 12px;box-sizing:border-box}
.rmw{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 16px;width:min(760px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
.rmw h3{margin:0 0 4px;letter-spacing:2px}.rmw h3 small{font-size:13px;color:var(--muted);letter-spacing:0}
.rmw svg{width:100%;height:auto;max-height:52vh;display:block;border:2px solid #b9a77f;border-radius:4px}
.pl{cursor:pointer}.pl circle{fill:rgba(255,250,240,.75);stroke:#6b5a44;stroke-width:2}.pl text{font-size:15px;text-anchor:middle;font-weight:700;fill:#3a2e24;paint-order:stroke;stroke:#f4ecd8;stroke-width:4px}
.pl.on circle{fill:#b23a2a;stroke:#7a2218}.pl.shake{animation:shk .35s}
.ar{fill:none;stroke:#b23a2a;stroke-width:4;stroke-linecap:round}.ar.eye{stroke:#2f5d6e;stroke-width:3}.ar.hi{stroke:#e0782a;stroke-width:6}
.rmsg{font-size:18px;margin:8px 0}.rlist{display:flex;flex-direction:column;gap:6px}
.rs{font:inherit;font-size:16px;text-align:left;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:#fffaf0;cursor:pointer}.rs.on{border-color:#e0782a;background:#fff1dc}
#textbox{position:fixed;inset:0;z-index:30;background:rgba(30,36,34,.6);display:flex;align-items:center;justify-content:center}
.tbw{background:var(--paper);border:2px solid var(--line);border-radius:10px;width:min(680px,calc(100% - 28px));max-height:84vh;overflow:auto;padding:14px 20px;box-sizing:border-box;position:relative}
.tbw h3{margin:0 0 8px;letter-spacing:2px}
.tbw .close{position:sticky;top:0;float:right;font:inherit;font-size:15px;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:#fffaf0;cursor:pointer}
.tb p{font-size:18px;line-height:1.95;margin:0 0 10px;text-indent:0}
.tb .pn{display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:50%;background:#efe2c4;font-size:13px;margin-right:6px;vertical-align:2px}
.tb #cur{background:#fff6dc;border-radius:6px;padding:4px 6px}
#end{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(40,52,50,.6);overflow:auto}
#end .card{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:18px 20px;width:min(640px,calc(100% - 28px));max-height:calc(100% - 36px);overflow:auto;box-sizing:border-box}
#end h2{margin:0 0 10px;letter-spacing:2px}
#end .scroll{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:#e9dfc6;border:2px solid #b9a77f;border-radius:4px}
#end figure{margin:0;height:84px;background-size:cover;background-position:center;position:relative;border-radius:2px}
#end figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:13px;text-align:center;padding:2px}
.score{font-size:18px}
.rev{border-top:1px dashed var(--line);padding:8px 0;font-size:15px;line-height:1.6}
.rq{font-weight:700}
.endbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.endbtns button{font:inherit;font-size:17px;padding:8px 20px;border:none;border-radius:6px;background:var(--seal);color:#fff;cursor:pointer}
#toast{z-index:20}
#wordbar{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;background:rgba(250,244,230,.94);border:2px solid var(--line);border-radius:18px;padding:5px 16px;font-size:18px;white-space:nowrap}
#wordbar span{display:inline-block;min-width:1.4em;text-align:center;margin:0 2px;border-bottom:2px solid var(--line);font-weight:700;color:var(--muted)}#wordbar span.got{color:var(--seal)}
body.vn #wordbar{display:none}
#compass{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:92px;z-index:4;pointer-events:none;text-align:center}
#compass svg{width:92px;height:92px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
#compass .cap{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1px 4px;margin-top:2px}
@media (max-width:600px){#compass,#compass svg{width:72px}#compass svg{height:72px}}
#start{z-index:40}
@media (max-width:700px){#txt{font-size:18px}#actor{height:46vh}#dlg{max-height:60vh}}
@media (prefers-reduced-motion:reduce){.bg{animation:none}}
</style>

<script>
(function(){

const scene = new T.Scene();

  vertexShader:'uniform mat4 textureMatrix; varying vec4 vUv; varying vec2 vP; void main(){ vUv=textureMatrix*vec4(position,1.); vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',

    ' vec3 r=texture2DProj(tDiffuse,uv).rgb;',

// ---------- 湖心島與歷下亭 ----------
const isl = new T.Mesh(new T.CylinderGeometry(ISL.r, ISL.r+0.8, 1.2, 28), lam('#b9b07a')); isl.position.set(ISL.x,-0.3,ISL.z); isl.receiveShadow=true; scene.add(isl);
const pav = new T.Group(); pav.position.set(ISL.x,0.3,ISL.z); scene.add(pav);
{ const base=new T.Mesh(new T.CylinderGeometry(3.4,3.6,0.6,8),lam('#d8cfbd')); base.position.y=0.3; base.receiveShadow=base.castShadow=true; pav.add(base);
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2+Math.PI/8; const c=new T.Mesh(new T.CylinderGeometry(0.18,0.18,3.2,6),lam('#a8432f')); c.position.set(Math.cos(a)*2.8,2.2,Math.sin(a)*2.8); c.castShadow=true; pav.add(c); }
  const eave=new T.Mesh(new T.ConeGeometry(4.6,0.9,8,1,true),new T.MeshLambertMaterial({color:'#2f5d6e',side:T.DoubleSide})); eave.position.y=4.0; eave.castShadow=true; pav.add(eave);

// 碼頭

// ---------- 鐵公祠 ----------

{ // 圍牆

// ---------- 千佛山（南方遠山） ----------
const peaks=[[-210,-175,48,55],[-120,-170,62,45],[-45,-152,74,40],[25,-168,66,44],[100,-150,52,38],[175,-172,60,50],[60,-128,30,26],[-80,-128,30,26],[240,-160,45,50]];
function mh(x,z){ let h=0; for(const p of peaks){ const dx=x-p[0],dz=z-p[1]; h+=p[2]*Math.exp(-(dx*dx+dz*dz)/(p[3]*p[3])); }
  h+=3*Math.sin(x*.13)*Math.sin(z*.17)+2*Math.sin(x*.31+z*.2); const f=Math.min(1,Math.max(0,(-z-92)/22)); return Math.max(0,h*f); }
{ const g=new T.PlaneGeometry(620,170,124,40); g.rotateX(-Math.PI/2); g.translate(0,0,-180);
  const pos=g.attributes.position, col=[]; const cTop=new T.Color('#2e5f7a'), cMid=new T.Color('#3f8a68'), cLow=new T.Color('#b59a62'), c=new T.Color();
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i), z=pos.getZ(i), h=mh(x,z); pos.setY(i,h+0.2);
    const t=Math.min(1,h/60); if(t<.5) c.copy(cLow).lerp(cMid,t*2); else c.copy(cMid).lerp(cTop,(t-.5)*2); c.offsetHSL(0,0,(rnd()-.5)*.05); col.push(c.r,c.g,c.b); }
  g.setAttribute('color',new T.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  const m=new T.Mesh(g,new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1})); scene.add(m);
  const m2=m.clone(); m2.rotation.y=Math.PI; m2.scale.y=0.5; scene.add(m2); /* 北方的遠山，鏡頭朝北時看得到 */ }
// 山上的寺廟、松柏、楓樹
function spots(n,minH){ const r=[]; let tries=0; while(r.length<n && tries<5000){ tries++; const x=(rnd()-.5)*460, z=-100-rnd()*110, h=mh(x,z); if(h>minH) r.push([x,h,z]); } return r; }
function inst(geo,mat,list,sc,cast){ const im=new T.InstancedMesh(geo,mat,list.length); const o=new T.Object3D();
  list.forEach((p,i)=>{ o.position.set(p[0],p[1],p[2]); const s=sc*(0.8+rnd()*0.5); o.scale.set(s,s,s); o.rotation.y=rnd()*6; o.updateMatrix(); im.setMatrixAt(i,o.matrix); }); if(cast) im.castShadow=true; scene.add(im); return im; }
{ const pg=new T.ConeGeometry(1.4,5,6); pg.translate(0,2.5,0); inst(pg,lam('#2c5a46'),spots(260,6),1,false);
  const mg=new T.IcosahedronGeometry(2,0); mg.translate(0,2,0); inst(mg,lam('#c0402a'),spots(70,8),1,false); inst(mg,lam('#d98a3a'),spots(25,8),0.9,false);
  const tw=new T.BoxGeometry(5,3,4); tw.translate(0,1.5,0); const tr=new T.ConeGeometry(4,2.2,4); tr.rotateY(Math.PI/4); tr.translate(0,4,0);
  const ts=spots(26,14); inst(tw,lam('#f2efe6'),ts,1,false); inst(tr,lam('#2a4652'),ts,1,false);
  const rw=new T.BoxGeometry(4,2.6,3.4); rw.translate(0,1.3,0); const rs=spots(18,10); inst(rw,lam('#b8402c'),rs,1,false); inst(tr,lam('#2a4652'),rs,0.9,false); }

// ---------- 湖邊的柳樹、樹、蘆葦、荷葉 ----------
{ const W=[]; for(let i=0;i<70;i++){ const a=rnd()*Math.PI*2, k=1.12+rnd()*0.22, x=Math.cos(a)*RX*k, z=Math.sin(a)*RZ*k;
    if(Math.hypot(x-60,z-40)<16 || Math.hypot(x-40,z-53)<9 || Math.hypot(x+30,z+38.5)<8 || z<-RZ*0.95) continue; W.push([x,0.3,z]); }
  const tg=new T.CylinderGeometry(0.25,0.35,3,5); tg.translate(0,1.5,0); inst(tg,lam('#5a4632'),W,1,true);
  const cg=new T.ConeGeometry(2.4,5,8,1,true); cg.translate(0,4.3,0); inst(cg,new T.MeshLambertMaterial({color:'#a9ad5e',side:T.DoubleSide}),W,1,true);
  const tg2=[]; for(let i=0;i<90;i++){ const x=(rnd()-.5)*240, z=(rnd()-.5)*150; if(inLake(x*0.85,z*0.85)||z<-70||Math.hypot(x-60,z-40)<16||Math.hypot(x-40,z-53)<9) continue; tg2.push([x,0.3,z]); }
  const rg=new T.IcosahedronGeometry(2.6,1); rg.translate(0,4,0);
  inst(rg,lam('#4f7f5c'),tg2.filter((_,i)=>i%4<2),1,true); inst(rg,lam('#c9823a'),tg2.filter((_,i)=>i%4===2),0.9,true); inst(rg,lam('#b8452e'),tg2.filter((_,i)=>i%4===3),0.85,true);
  inst(tg,lam('#5a4632'),tg2,1,true);
  // 湖岸的青綠色石頭（插圖裡常見）
  const RK=[]; for(let i=0;i<70;i++){ const a=rnd()*Math.PI*2, k=1.02+rnd()*0.06, x=Math.cos(a)*RX*k, z=Math.sin(a)*RZ*k; if(Math.hypot(x-60,z-40)<14||Math.hypot(x+30,z+38.5)<7) continue; RK.push([x,0.1,z]); }
  const rkg=new T.DodecahedronGeometry(1.1,0); rkg.scale(1.3,0.7,1); inst(rkg,lam('#4f7f86'),RK,1,false);

}
// 南岸蘆葦（白花，夕陽時變粉紅）
const reedTipMat = new T.MeshLambertMaterial({color:'#f6f2e8'});
{ const R=[]; for(let x=-24;x<55;x+=0.55){ const ez=-RZ*Math.sqrt(Math.max(0,1-(x*x)/(RX*RX))); for(let k=0;k<2;k++) R.push([x+(rnd()-.5)*.5,0.1,ez-0.6-rnd()*2.6]); }
  const sg=new T.CylinderGeometry(0.04,0.06,2.6,4); sg.translate(0,1.3,0); inst(sg,lam('#b8a36a'),R,1,false);
  const tg=new T.SphereGeometry(0.22,6,5); tg.scale(1,2.4,1); tg.translate(0,2.8,0); inst(tg,reedTipMat,R,1,false); }
// 荷葉、荷花（歷下亭後面最多）
{ const L=[], F=[]; for(let i=0;i<260;i++){ const a=rnd()*Math.PI*2, d=ISL.r+1+rnd()*14, x=ISL.x+Math.cos(a)*d*1.3, z=ISL.z+Math.abs(Math.sin(a))*d+2;

  const pg=new T.CylinderGeometry(0.35,0.2,0.4,8); pg.translate(0,1.0,0); inst(pg,lam('#8a9a4a'),F,1,false); }

// 水鳥

// ---------- 音效（不用音檔，用程式合成） ----------
let AC=null; function ac(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(kind){ const a=ac(); if(!a) return; const t0=a.currentTime;
  if(kind==='ding'){ [880,1320].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0.12,t0+i*0.08); g.gain.exponentialRampToValueAtTime(0.001,t0+i*0.08+0.5); o.connect(g).connect(a.destination); o.start(t0+i*0.08); o.stop(t0+i*0.08+0.5); }); }
  if(kind==='bad'){ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.setValueAtTime(220,t0); o.frequency.linearRampToValueAtTime(160,t0+0.2); g.gain.setValueAtTime(0.12,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.3); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+0.3); }
  if(kind==='song'){ const notes=[392,440,523,440,392,330,392]; notes.forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=f; const s=t0+i*0.32; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(0.09,s+0.05); g.gain.exponentialRampToValueAtTime(0.001,s+0.45); o.connect(g).connect(a.destination); o.start(s); o.stop(s+0.5); }); }
  if(kind==='rustle'){ for(let k=0;k<4;k++){ const len=0.12, buf=a.createBuffer(1,a.sampleRate*len,a.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=3000; const g=a.createGain(); g.gain.value=0.35; s.connect(f).connect(g).connect(a.destination); s.start(t0+k*0.22); } }
  if(kind==='flap'){ for(let k=0;k<7;k++){ const len=0.06, buf=a.createBuffer(1,a.sampleRate*len,a.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length/4));
      const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g=a.createGain(); g.gain.value=0.9; s.connect(f).connect(g).connect(a.destination); s.start(t0+k*0.11); } }
  if(kind==='pop'){ const o=a.createOscillator(),g=a.createGain(); o.frequency.setValueAtTime(600,t0); o.frequency.exponentialRampToValueAtTime(1200,t0+0.08); g.gain.setValueAtTime(0.1,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.15); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+0.15); }
}

function setFace(w){ const u=PPL[w]; face.hidden=!u; if(u) face.style.backgroundImage='url("'+u+'")'; }

function lineHtml(s){ let t=esc(s.t); if(s.hl && s.t.includes(s.hl)) t=t.replace(esc(s.hl),'<mark>'+esc(s.hl)+'</mark>'); return t; }

let queue=[], talking=false, busy=false, onDone=null, curRight=null, lastHl=null;
function play(steps,done,clear){ queue=steps.slice(); talking=true; target=null; onDone=done; vn.classList.toggle('clear',!!clear); vn.hidden=false; document.body.classList.add('vn'); requestAnimationFrame(()=>vn.classList.add('on')); next(); }
function closeVN(){ document.body.classList.remove('vn'); vn.classList.remove('on'); actor.classList.remove('show'); setTimeout(()=>{ if(!talking) vn.hidden=true; },600); }
function next(){ if(busy) return;
  if(!queue.length){ talking=false; closeVN(); const d=onDone; onDone=null; d&&d(); return; }
  const s=queue.shift();
  if(s.bg){ setBg(s.bg,s); return next(); }
  if(s.quiz){ const picks=shuffle(Q[s.quiz]).slice(0,s.n); queue.unshift(...picks.map(q=>({q}))); return next(); }
  if(s.q) return ask(s.q);
  if(s.task) return TASKS[s.task]();
  if(s.igoal){ goalNow=s.igoal; updHint(); queue.unshift({w:'旁白',t:'【下一步】'+s.igoal}); return next(); }
  if(s.goal){ setupWords(s.goal); goalNow=GOALS[s.goal]; updHint(); queue.unshift({w:'旁白',t:'【下一站】'+GOALS[s.goal]}); return next(); }
  if(!s.t){ s.act&&s.act(); return next(); }
  ch.innerHTML=''; more.hidden=false; dlg.classList.remove('asking');
  who.textContent=s.w==='旁白'?'':s.w; setFace(s.w); showActor(s.w);
  txt.innerHTML=lineHtml(s); lastHl=s.hl||lastHl; quoteEl.innerHTML=s.hl?quoteHtml(s.hl):''; s.act&&s.act(); }
function wait(){ busy=true; more.hidden=true; dlg.classList.add('asking'); }
function done(go){ busy=false; dlg.classList.remove('asking'); if(go!==false) next(); }
function goBtn(label){ const b=document.createElement('button'); b.className='go'; b.type='button'; b.textContent=label||'繼續 ▶'; b.addEventListener('click',e=>{e.stopPropagation(); done();}); ch.appendChild(b); b.focus({preventScroll:true}); }
function record(q,first,picked){ answered.push({q,first,picked}); }

function ask(q){ wait(); const sp=q.w||'老殘'; who.textContent=sp+'考你'; setFace(sp); showActor(sp);
  txt.textContent=q.q; quoteEl.innerHTML='<button class="peek" type="button">📜 看課文線索</button>';
  quoteEl.querySelector('.peek').addEventListener('click',e=>{ e.stopPropagation(); openText(q.hl); });
  ch.innerHTML=''; let wrong=false, picked=null;
  shuffle(q.o.map((o,i)=>({o,ok:i===0}))).forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.textContent=c.o; b.className='opt'; if(c.ok) curRight=b;
    b.addEventListener('click',e=>{ e.stopPropagation(); if(b.disabled) return;
      if(c.ok){ [...ch.children].forEach(x=>x.disabled=true); b.classList.add('right'); tone('ding');
        txt.innerHTML='<b class="ok">答對了！</b>'+esc(q.why); quoteEl.innerHTML=quoteHtml(q.hl)+'<span class="src">「'+esc(q.hl)+'」</span>';
        record(q,!wrong,picked); goBtn(); }
      else { b.disabled=true; b.classList.add('wrong'); tone('bad'); if(!wrong){ wrong=true; picked=c.o; }
        txt.innerHTML=esc(q.q)+'<br><span class="tip">再想想！線索在課文這一句：「'+esc(q.hl)+'」</span>'; } });
    ch.appendChild(b); }); }

function openText(hl){ const i=hl?paraOf(hl):(lastHl?paraOf(lastHl):0);

  textBox.querySelector('.tb').innerHTML=html; textBox.hidden=false; const c=document.getElementById('cur'); c&&c.scrollIntoView({block:'center'}); }

{ const W=[[16,-12],[0,-13],[-12,-12],[-24,-13],[16,30],[-30,30],[-50,24],[-52,2],[14,10],[-38,-4]];

let innerStep=0;
const innerLabels=INNER.map(w=>{ const el=document.createElement('div'); el.className='label'; el.textContent=w.name; el.style.display='none'; labelBox.appendChild(el); return el; });
function enterInner(){ mode='inner'; inner.add(kid,lao,beacon,arrow); boat.visible=false;
  P.set(6,0.3,-16); laoPos.set(8.5,0.3,-17); heading=0; target=null; innerStep=0; step=order.indexOf('inner');
  stations.forEach(s=>s.el.style.display='none'); goalNow=INNER[0].goal; first=true; updHint(); toast('走進鐵公祠：用方向鍵或點地面走路'); }

  P.set(42,0.3,16); laoPos.set(44,0.3,15); heading=Math.PI; target=null; step=order.indexOf('he'); goalNow=GOALS.he; first=true; updHint(); }
function checkInner(){ if(talking) return; const w=INNER[innerStep]; if(!w) return;
  if(Math.hypot(P.x-w.x,P.z-w.z)<w.r){ innerStep++; const nxt=INNER[innerStep];
    if(w.final){ play(SCENES.shui,updHint); goalNow=null; }
    else play(w.steps.concat(nxt?[{igoal:nxt.goal}]:[]),updHint,true);
    updHint(); } }


// ---------- 湖上小遊戲：撈起課文裡的方位字 ----------
const WORDSETS={lixia:{w:'朝北不遠',a:[-30,-30],b:[-6,0]}, tie:{w:'向西盪去',a:[2,2],b:[44,24]}, he:{w:'盪到亭後',a:[40,16],b:[0,22]}, end:{w:'鵲華橋畔',a:[-8,18],b:[-28,-30]}};
const wordbar=document.getElementById('wordbar'); let tokens=[], wordKey=null, wordGot=0;
function charTex(ch){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
  x.fillStyle='#4c7a5c'; x.beginPath(); x.arc(64,64,58,0.25,Math.PI*2-0.05); x.lineTo(64,64); x.fill(); x.strokeStyle='#2f4f3a'; x.lineWidth=4; x.stroke();
  x.fillStyle='#fdf6e3'; x.beginPath(); x.arc(64,64,38,0,Math.PI*2); x.fill();
  x.fillStyle='#7a2218'; x.font='bold 54px "PingFang TC","Noto Serif TC",serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(ch,64,68); return new T.CanvasTexture(c); }
function setupWords(key){ tokens.forEach(t=>scene.remove(t.s)); tokens=[]; wordKey=null; wordbar.hidden=true; const S=WORDSETS[key]; if(!S) return;
  wordKey=key; wordGot=0; const chars=[...S.w];
  chars.forEach((ch,i)=>{ const u=(i+1)/(chars.length+1); let x=S.a[0]+(S.b[0]-S.a[0])*u, z=S.a[1]+(S.b[1]-S.a[1])*u; x+=(i%2?1:-1)*(4+rnd()*3); z+=(rnd()-.5)*4;
    if(!isWater(x,z)){ x=S.a[0]+(S.b[0]-S.a[0])*u; z=S.a[1]+(S.b[1]-S.a[1])*u; }
    const s=new T.Sprite(new T.SpriteMaterial({map:charTex(ch),fog:false})); s.scale.set(4.2,4.2,1); s.position.set(x,1.8,z); s.layers.set(1); scene.add(s); tokens.push({ch,s,x,z,i,got:false}); });
  renderWordbar(); wordbar.hidden=false; }
function renderWordbar(){ const S=WORDSETS[wordKey]; if(!S) return; wordbar.innerHTML='🪷 划船撈字卡：'+[...S.w].map((c,i)=>'<span class="'+(i<wordGot?'got':'')+'">'+(i<wordGot?c:'？')+'</span>').join(''); }
let wordWarnT=0;
function updWords(t){ if(!wordKey||mode!=='lake'||talking) return; tokens.forEach(k=>{ if(k.got) return; k.s.position.y=1.8+Math.sin(t*2+k.i)*0.25;
    if(Math.hypot(P.x-k.x,P.z-k.z)<3){ if(k.i===wordGot){ k.got=true; scene.remove(k.s); wordGot++; tone('pop'); renderWordbar();
        if(wordGot===tokens.length){ tone('ding'); toast('撈齊了：「'+WORDSETS[wordKey].w+'」！'); setTimeout(()=>{ wordbar.hidden=true; },1800); wordKey=null; } }
      else if(t-wordWarnT>2){ wordWarnT=t; toast('要照順序撈，先找「'+tokens[wordGot].ch+'」'); } } }); }

// ---------- 鍵盤與方向按鈕 ----------
const keys={};
const KEYMAP={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{ const k=KEYMAP[e.code]; if(k){ keys[k]=1; e.preventDefault(); }
  if((e.code==='Space'||e.code==='Enter') && talking && !busy && !e.target.closest('button')){ e.preventDefault(); next(); } });
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys[k]=0; });
document.querySelectorAll('#pad button').forEach(b=>{ const k=KEYMAP[b.dataset.k];
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[k]=1; b.setPointerCapture&&b.setPointerCapture(e.pointerId); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0)); });
let mode='lake', turnT=0, turnFrom=0;
const compassEl=document.querySelector('#compass svg'), faceEl=document.querySelector('#compass #facing');

// ---------- 主迴圈 ----------
const clock=new T.Clock(); const tmp=new T.Vector3(); let first=true;
function loop(){ const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  // 移動
  let moving=false;
  const kx=(keys.l?1:0)-(keys.r?1:0), kz=(keys.u?1:0)-(keys.d?1:0);
  if((kx||kz) && !talking && mode!=='turn'){ target=null; const len=Math.hypot(kx,kz); tmp.set(kx/len,0,kz/len);
    const sp=(mode==='lake'&&isWater(P.x,P.z)?9:7)*dt; moving=true;
    tryMove(P.x+tmp.x*sp, P.z+tmp.z*sp);
    const want=Math.atan2(tmp.x,tmp.z); let da=want-heading; while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2; heading+=da*Math.min(1,dt*10); }
  else if(target && !talking && mode!=='turn'){ tmp.subVectors(target,P); tmp.y=0; const d=tmp.length();
    if(d<0.3) target=null; else { moving=true; const sp=(isWater(P.x,P.z)?9:7)*dt; tmp.normalize();
      const nx=P.x+tmp.x*Math.min(sp,d), nz=P.z+tmp.z*Math.min(sp,d); if(!tryMove(nx,nz)) target=null;
      const want=Math.atan2(tmp.x,tmp.z); let da=want-heading; while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2; heading+=da*Math.min(1,dt*8); } }
  inBoat=mode!=='inner'&&isWater(P.x,P.z);
  walkPhase+= moving? dt*10 : 0;
  // 小藥童
  kid.position.set(P.x, inBoat?0.55:0.3, P.z); kid.rotation.y=heading;
  const sw=moving&&!inBoat?Math.sin(walkPhase)*0.35:0; kid.userData.legL.rotation.x=sw; kid.userData.legR.rotation.x=-sw; kid.userData.body.position.y=0.85*0.82+(moving&&!inBoat?Math.abs(Math.sin(walkPhase))*0.06:0);
  // 老殘：走路時跟在後面，坐船時坐在船尾
  if(inBoat){ laoPos.set(P.x-Math.sin(heading)*2.2, 0.55, P.z-Math.cos(heading)*2.2); lao.rotation.y=heading; }
  else { tmp.subVectors(P,laoPos); tmp.y=0; const d=tmp.length(); if(d>2.6){ tmp.normalize(); laoPos.x+=tmp.x*(d-2.6)*Math.min(1,dt*6); laoPos.z+=tmp.z*(d-2.6)*Math.min(1,dt*6); lao.rotation.y=Math.atan2(tmp.x,tmp.z); } laoPos.y=0.3; }
  lao.position.copy(laoPos); const lsw=(moving&&!inBoat)?Math.sin(walkPhase+1)*0.3:0; lao.userData.legL.rotation.x=lsw; lao.userData.legR.rotation.x=-lsw;
  // 船
  boat.visible=inBoat; if(inBoat){ boat.position.set(P.x-Math.sin(heading)*0.9, 0.05+Math.sin(t*2)*0.06, P.z-Math.cos(heading)*0.9); boat.rotation.y=heading; boat.rotation.z=Math.sin(t*1.6)*0.03; boat.userData.oar.rotation.x=moving?Math.sin(t*5)*0.5:0; }
  // 水鳥
  for(let i=birds.length-1;i>=0;i--){ const b=birds[i]; b.userData.life+=dt; b.position.addScaledVector(b.userData.v,dt); b.userData.p+=dt*14; const f=Math.sin(b.userData.p)*0.7; b.userData.wl.rotation.z=f; b.userData.wr.rotation.z=-f; if(b.userData.life>6){ scene.remove(b); birds.splice(i,1);} }
  // 鐵公祠前轉身：鏡頭和人物一起從北慢慢轉向南
  if(mode==='turn'){ turnT+=dt; const u=Math.min(1,Math.max(0,(turnT-0.6)/2.6)), e=u*u*(3-2*u); const yaw=turnFrom+(Math.PI-turnFrom)*e;
    kid.rotation.y=yaw; lao.rotation.y=yaw; lao.position.set(53,0.3,27.5);
    compassEl.style.transform='rotate('+(yaw*180/Math.PI)+'deg)'; heading=yaw; }
  // 時間
  duskNow+=(dusk-duskNow)*Math.min(1,dt*0.6); applyTime(duskNow); inkMat.uniforms.warm.value=duskNow;
  // 鏡頭
  const dc=desiredCam(); const k=first?1:Math.min(1,dt*(mode==='turn'?10:cineMode?1.2:4)); camPos.lerp(dc.pos,k); camLook.lerp(dc.look,k); first=false;
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(P.x-60+duskNow*20, 90-duskNow*45, P.z+50-duskNow*90); sun.target.position.set(P.x,0,P.z); sc.updateProjectionMatrix();
  water.material.uniforms.time.value=t;
  if(mode==='inner') checkInner(); else checkStations();
  if(mode!=='turn') faceEl.setAttribute('transform','rotate('+(-heading*180/Math.PI)+' 50 50)');
  updAmbient(t); updWords(t); updGuide(t); if(!(talking && vn.classList.contains('on') && !vn.classList.contains('clear'))) drawScene();
  // 標籤
  if(mode==='inner'){ INNER.forEach((w,i)=>{ innerLabels[i].classList.toggle('next',i===innerStep); innerLabels[i].classList.toggle('done',i<innerStep); place(innerLabels[i],w.x,6,w.z); }); }
  else { innerLabels.forEach(e=>e.style.display='none'); stations.forEach(s=>place(s.el, s.x, s.id==='lixia'?8.5:s.id==='tie'?8:s.id==='shui'?6:s.id==='que'?5:2, s.z)); }
  mLabel.style.display='none';
  requestAnimationFrame(loop); }
const pv=new T.Vector3();
function place(el,x,y,z){ pv.set(x,y,z).project(camera); if(pv.z>1||Math.abs(pv.x)>1.1||Math.abs(pv.y)>1.1){ el.style.display='none'; return; } el.style.display=''; el.style.left=((pv.x+1)/2*innerWidth)+'px'; el.style.top=((1-pv.y)/2*innerHeight)+'px'; }
updHint(); loop();
window.__dbg={P,setTarget,next,get mode(){return mode},get innerStep(){return innerStep},answerRight:()=>curRight&&curRight.click(),get talking(){return talking},get busy(){return busy},get step(){return step}};
})();
