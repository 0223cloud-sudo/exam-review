<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<title>跟著老殘遊明湖</title>
<style>
/* 全螢幕 3D 畫面，上面疊一層古風介面 */
:root{--paper:#f4ecd8;--ink:#2f2a24;--muted:#6b5d4b;--seal:#b23a2a;--panel:rgba(250,244,230,.93);--line:#c9b48c;color-scheme:light}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe0e6;color:var(--ink);font-family:"PingFang TC","Noto Serif TC","Songti TC",serif;-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:15px;box-shadow:0 2px 8px #0002}
.chip b{color:var(--seal)}
.title{font-size:18px;letter-spacing:2px}
.label{position:fixed;transform:translate(-50%,-100%);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:14px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px #0003}
.label.done{color:var(--muted)}
.label.done::after{content:" ✓";color:var(--seal)}
.label.next{border-color:var(--seal);color:var(--seal);font-weight:700}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--seal);color:#fff;padding:10px 20px;border-radius:6px;font-size:18px;box-shadow:0 4px 12px #0004;transition:opacity .4s;opacity:0;pointer-events:none}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,52,50,.45)}
#start .card{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:22px 26px;max-width:min(420px,calc(100% - 40px));text-align:center;box-shadow:0 6px 24px #0005}
#start h1{margin:0 0 6px;font-size:28px;letter-spacing:4px}
#start p{margin:8px 0;font-size:16px;line-height:1.6;color:var(--muted)}
#go{margin-top:10px;font:inherit;font-size:18px;padding:10px 28px;border-radius:6px;border:none;background:var(--seal);color:#fff;cursor:pointer}
#go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.sb{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.sb span{width:10px;height:14px;background:#e3d8bf;border:1px solid var(--line)}
.sb span.on{background:linear-gradient(#5a9a8a,#2f6a86)}
.hud{z-index:10}
#vn{position:fixed;inset:0;z-index:5;opacity:0;transition:opacity .6s;background:#2d3a35;overflow:hidden}
#vn.on{opacity:1}
/* 插圖完整顯示（不裁切）：中間是完整的圖，四周用同一張圖的模糊放大版補滿 */
.bg{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .9s,filter 1s;background:#2d3a35}
.bg::before{content:"";position:absolute;inset:-40px;background:var(--im) center/cover no-repeat;filter:blur(22px) brightness(.72) saturate(.9)}
.bg::after{content:"";position:absolute;inset:0;background:var(--im) 50% 30%/contain no-repeat}
.bg.in{opacity:1}
#pic{position:absolute;transform-origin:50% 30%;transition:transform 2.8s ease}
#pic canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,calc(-100% - 8px));background:rgba(178,58,42,.93);color:#fff;font-size:clamp(14px,1.7vw,19px);font-weight:700;padding:3px 12px;border-radius:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);animation:tagIn .45s ease-out}
.tag::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(178,58,42,.93)}
.tag.blue{background:rgba(47,93,110,.93)}.tag.blue::after{border-top-color:rgba(47,93,110,.93)}
@keyframes tagIn{from{opacity:0;transform:translate(-50%,calc(-100% - 22px))}}
#cap{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:2;background:rgba(250,244,230,.93);border:2px solid #a8322a;border-radius:4px;padding:6px 18px 6px 14px;font-size:clamp(18px,2.6vw,28px);letter-spacing:4px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;transition:opacity .5s;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#cap::before{content:"明湖";display:inline-block;writing-mode:vertical-rl;font-size:.42em;letter-spacing:0;background:#b23a2a;color:#f6e3b4;padding:3px 2px;margin-right:10px;vertical-align:middle;border-radius:2px}
#songBanner{position:absolute;top:24%;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;background:rgba(178,58,42,.9);color:#fff8e6;font-size:clamp(28px,5vw,52px);letter-spacing:8px;padding:10px 34px;border-radius:40px;box-shadow:0 0 0 6px rgba(255,240,200,.35),0 8px 30px rgba(0,0,0,.4);white-space:nowrap;animation:sing 1.2s ease-in-out infinite alternate}
@keyframes sing{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08);box-shadow:0 0 0 14px rgba(255,240,200,.2),0 8px 30px rgba(0,0,0,.4)}}
#vn.clear{background:transparent;pointer-events:none}
#vn.clear #dlg{pointer-events:auto}
#vn.clear .bg,#vn.clear #pic,#vn.clear #sunset,#vn.clear #actor{display:none}
#readBtn{font:inherit;font-size:14px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);cursor:pointer}
.tb .say{font:inherit;font-size:13px;margin-left:6px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:#fffaf0;cursor:pointer;vertical-align:2px}
#helpBtn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;font:inherit;font-size:20px;padding:12px 26px;border-radius:28px;border:3px solid #fff3d6;background:#b23a2a;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;animation:sing 1s ease-in-out infinite alternate}
body.vn #helpBtn{display:none}
#intro{position:fixed;inset:0;z-index:45;background:#1d2422;overflow:hidden;color:#f6ecd2}
#intro .bg{transition:opacity 1.4s,transform 9s linear}
#intro .bg.in{transform:scale(1.06)}
#intro .ln{position:absolute;left:50%;transform:translateX(-50%);bottom:18%;width:min(900px,calc(100% - 40px));text-align:center;font-size:clamp(22px,3.6vw,38px);letter-spacing:4px;line-height:1.7;text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 2px #000;opacity:0;transition:opacity 1s}
#intro .ln.on{opacity:1}
#intro .scroll{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:min(70vh,520px);width:0;max-width:calc(100% - 40px);background:linear-gradient(90deg,#e9dcb8,#f6ecd2 12%,#f6ecd2 88%,#e9dcb8);border-top:10px solid #6b3a22;border-bottom:10px solid #6b3a22;box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden;transition:width 2.2s ease-in-out,opacity 1s;display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,50px);color:#2f2a24}
#intro .scroll.open{width:min(760px,calc(100% - 40px))}
#intro .scroll .v{writing-mode:vertical-rl;white-space:nowrap}
#intro .scroll .big{font-size:clamp(56px,10vw,110px);letter-spacing:12px;font-weight:700}
#intro .scroll .small{font-size:clamp(20px,3vw,30px);letter-spacing:6px;color:#5a4a3a}
#intro .scroll .seal{writing-mode:vertical-rl;background:#b23a2a;color:#f6e3b4;padding:8px 6px;font-size:clamp(16px,2.2vw,22px);border-radius:3px}
#intro .who{position:absolute;bottom:0;right:6%;height:min(78vh,620px);opacity:0;transform:translateX(40px);transition:opacity 1s,transform 1.2s;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#intro .who.on{opacity:1;transform:none}
#intro .skip{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font:inherit;font-size:16px;padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;cursor:pointer;z-index:2}
#start .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#start .ghost{margin-top:10px;font:inherit;font-size:16px;padding:10px 20px;border-radius:6px;border:2px solid var(--seal);background:transparent;color:var(--seal);cursor:pointer}
.longscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid #b9a77f;border-radius:4px;background:#e9dfc6}
.longscroll img{display:block;height:min(42vh,320px);width:auto;max-width:none;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.codebox{margin-top:12px;padding:10px 12px;background:#fff6dc;border:2px dashed var(--seal);border-radius:8px}
.codebox input{font:inherit;font-size:18px;width:5em;padding:4px 6px;border:2px solid var(--line);border-radius:6px;user-select:text;-webkit-user-select:text}
.codebox .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(17px,2.6vw,22px);letter-spacing:1px;word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:8px 0;user-select:all;-webkit-user-select:all}
.retry{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.retry .opt{display:block;width:100%;margin:6px 0}
#modeChip{pointer-events:auto;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
#modeChip.ch{background:#b23a2a;color:#fff;border-color:#7a2218}
.stage{display:inline-block;background:var(--seal);color:#fff;border-radius:10px;padding:0 10px;font-size:15px;margin-right:8px;vertical-align:2px}
.method{display:block;margin-top:6px;background:#fff3d6;border-left:4px solid #c9a24a;padding:4px 10px;font-size:18px;color:#5a4320;border-radius:4px}
#txt b.bad{color:var(--seal);margin-right:6px}
.opt.shown{box-shadow:0 0 0 3px #2f7a4a55}
#start .note{font-size:14px;background:#f3e7c9;border-radius:8px;padding:6px 10px;color:#5a4a36}
#end .score b.big{font-size:40px;color:var(--seal)}
#musBtn{pointer-events:auto;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
#musBtn.off{color:var(--muted);text-decoration:line-through}
#pad{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
#pad button{font:inherit;font-size:22px;border-radius:12px;border:2px solid var(--line);background:rgba(250,244,230,.88);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
#pad button:active{background:var(--seal);color:#fff}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
body.vn #pad{display:none}
#compass svg{transition:transform .15s linear}
@media (max-width:600px){#pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}}
#sunset{position:absolute;inset:0;background:linear-gradient(rgba(255,135,80,.6),rgba(255,120,150,.5));mix-blend-mode:multiply;opacity:0;transition:opacity .25s;pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none}
#fx.shine{background:radial-gradient(circle at 50% 35%,rgba(255,250,220,.55),transparent 60%);animation:shine 1.6s ease-out forwards}
@keyframes shine{from{opacity:1}to{opacity:0}}
#fx.ripple{background:repeating-linear-gradient(0deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.12) 15px 16px);animation:rip 3s linear infinite;mask-image:linear-gradient(transparent 45%,#000 70%);-webkit-mask-image:linear-gradient(transparent 45%,#000 70%)}
@keyframes rip{from{background-position:0 0}to{background-position:0 64px}}
#actor{position:absolute;bottom:0;right:3%;height:min(80vh,640px);aspect-ratio:340/900;background-size:contain;background-repeat:no-repeat;background-position:bottom center;opacity:0;transform:translateY(6%);transition:opacity .35s,transform .35s;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));pointer-events:auto}
#actor.show{opacity:1;transform:none}
#actor.left{right:auto;left:3%}
#dlg.asking{cursor:default}
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(860px,calc(100% - 24px));max-height:calc(100% - 84px - env(safe-area-inset-bottom,0px));overflow:auto;background:rgba(250,244,230,.94);border:2px solid var(--line);border-radius:10px;padding:10px 16px 10px;box-shadow:0 6px 20px rgba(0,0,0,.35);box-sizing:border-box;z-index:3;cursor:pointer}
#who{font-weight:700;color:var(--seal);font-size:17px;flex:1}
#txt{font-size:23px;line-height:1.7;margin-top:4px}
#txt,.opt,.go,.method,.tip{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#more{text-align:right;font-size:13px;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:10px;min-height:28px}
#face{width:46px;height:46px;border-radius:50%;flex:none;background-color:#e8dcc0;background-size:260%;background-position:50% 2%;background-repeat:no-repeat;border:2px solid var(--line)}
#textBtn{font:inherit;font-size:14px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);cursor:pointer}
#quote{font-size:14px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qt{background:#efe2c4;border-radius:10px;padding:1px 8px}
.src{color:var(--muted)}
.peek{font:inherit;font-size:14px;padding:3px 10px;border-radius:12px;border:1px dashed var(--seal);background:transparent;color:var(--seal);cursor:pointer}
#txt b.ok{color:#2f7a4a;margin-right:6px}
.tip{color:var(--seal);font-size:17px}
.pink{color:#d0607a}
mark{background:linear-gradient(transparent 55%,#f4c96a 55%);color:inherit;font-weight:700}
#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-top:8px}
#choices:has(.tile){grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.opt,.go{font:inherit;font-size:20px;min-height:52px;padding:10px 14px;border-radius:8px;border:2px solid var(--line);background:#fffaf0;color:var(--ink);cursor:pointer;text-align:left}
.tile{text-align:center;font-size:22px;font-weight:700}
.opt.right{border-color:#2f7a4a;background:#e3f2e3}
.opt.wrong{border-color:var(--seal);background:#f6e0da;color:var(--muted);text-decoration:line-through}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.go{grid-column:1/-1;text-align:center;background:var(--seal);color:#fff;border-color:var(--seal)}
.opt:focus-visible,.go:focus-visible,#textBtn:focus-visible,.peek:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.couplet{display:block;text-align:center;margin:8px 0}
.couplet span{display:inline-block;vertical-align:top;margin:0 14px;line-height:1.25;background:#a8322a;color:#f6e3b4;padding:10px 10px;font-size:24px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.couplet span i,.couplet span b{display:block;font-style:normal}
.couplet .blank{color:#ffe08a;font-weight:700}
.couplet.one{writing-mode:horizontal-tb;background:#a8322a;color:#f6e3b4;padding:8px 14px;font-size:22px;letter-spacing:3px;border-radius:3px;width:fit-content;margin:8px auto}
.colors,.route{margin-top:6px;font-size:20px;line-height:1.8}
.colors span.now{background:#fff1c9;border-radius:6px;padding:0 4px}
.colors b,.route .got{color:var(--seal)}
.route span{display:inline-block;min-width:2.5em;text-align:center;border-bottom:2px solid var(--line);margin:0 2px}
.sun{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:18px}
.sun input{flex:1;min-width:0;height:30px}
.cnt{grid-column:1/-1;font-size:20px;text-align:center}
#field{position:absolute;inset:0;z-index:4}
.cdot{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #6b5a44;vertical-align:-3px;margin-right:6px}
.lbar{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(250,244,230,.95);border:2px solid var(--line);border-radius:20px;padding:8px 22px;font-size:22px;white-space:nowrap}
.lbar b{color:var(--seal)}
.pod.got{transform:scale(1.6);opacity:0;transition:.25s}
.pod.demo{position:static;display:inline-block;width:38px;height:38px;margin:0;animation:none;vertical-align:middle;cursor:default}
.pod{position:absolute;top:100%;width:86px;height:86px;margin-left:-43px;border-radius:50%;border:3px solid #5b5a2a;background:radial-gradient(circle at 30% 35%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle at 62% 30%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle at 48% 62%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle at 72% 64%,#3d3a1a 0 5px,transparent 6px),radial-gradient(circle,#b6b05a,#7f8a3a);animation:hop linear forwards;cursor:pointer;padding:0}
@keyframes hop{0%{top:100%;transform:rotate(0)}50%{top:18%}100%{top:105%;transform:rotate(200deg)}}
#routeMap{position:fixed;inset:0;z-index:8;background:rgba(40,52,50,.55);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px 12px;box-sizing:border-box}
.rmw{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 16px;width:min(760px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
.rmw h3{margin:0 0 4px;letter-spacing:2px}.rmw h3 small{font-size:13px;color:var(--muted);letter-spacing:0}
.rmw svg{width:100%;height:auto;max-height:52vh;display:block;border:2px solid #b9a77f;border-radius:4px}
.pl{cursor:pointer}.pl circle{fill:rgba(255,250,240,.75);stroke:#6b5a44;stroke-width:2}.pl text{font-size:15px;text-anchor:middle;font-weight:700;fill:#3a2e24;paint-order:stroke;stroke:#f4ecd8;stroke-width:4px}
.pl.on circle{fill:#b23a2a;stroke:#7a2218}.pl.shake{animation:shk .35s}
.ar{fill:none;stroke:#b23a2a;stroke-width:4;stroke-linecap:round}.ar.eye{stroke:#2f5d6e;stroke-width:3}.ar.hi{stroke:#e0782a;stroke-width:6}
.rmsg{font-size:18px;margin:8px 0}.rlist{display:flex;flex-direction:column;gap:6px}
.rs{font:inherit;font-size:16px;text-align:left;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:#fffaf0;cursor:pointer}.rs.on{border-color:#e0782a;background:#fff1dc}
#textbox{position:fixed;inset:0;z-index:30;background:rgba(30,36,34,.6);display:flex;align-items:center;justify-content:center}
.tbw{background:var(--paper);border:2px solid var(--line);border-radius:10px;width:min(680px,calc(100% - 28px));max-height:84vh;overflow:auto;padding:14px 20px;box-sizing:border-box;position:relative}
.tbw h3{margin:0 0 8px;letter-spacing:2px}
.tbw .close{position:sticky;top:0;float:right;font:inherit;font-size:15px;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:#fffaf0;cursor:pointer}
.tb p{font-size:18px;line-height:1.95;margin:0 0 10px;text-indent:0}
.tb .pn{display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:50%;background:#efe2c4;font-size:13px;margin-right:6px;vertical-align:2px}
.tb #cur{background:#fff6dc;border-radius:6px;padding:4px 6px}
#end{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(40,52,50,.6);overflow:auto}
#end .card{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:18px 20px;width:min(640px,calc(100% - 28px));max-height:calc(100% - 36px);overflow:auto;box-sizing:border-box}
#end h2{margin:0 0 10px;letter-spacing:2px}
#end .scroll{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:#e9dfc6;border:2px solid #b9a77f;border-radius:4px}
#end figure{margin:0;height:84px;background-size:cover;background-position:center;position:relative;border-radius:2px}
#end figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:13px;text-align:center;padding:2px}
.score{font-size:18px}
.rev{border-top:1px dashed var(--line);padding:8px 0;font-size:15px;line-height:1.6}
.rq{font-weight:700}
.endbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

<script>
(function(){
const T = THREE;
// ---------- 基本設定 ----------
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({canvas, antialias:true});
let DPR = Math.min(window.devicePixelRatio||1, 2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(40, 1, 0.5, 1200);
let seed = 7; function rnd(){ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; }
const RX = 60, RZ = 42;                 // 湖（橢圓）
const ISL = {x:-4, z:6, r:8};             // 湖心島
function inLake(x,z){ return (x*x)/(RX*RX)+(z*z)/(RZ*RZ) < 1; }
function onIsland(x,z){ return Math.hypot(x-ISL.x,z-ISL.z) < ISL.r-0.6; }
function isWater(x,z){ return inLake(x,z) && !onIsland(x,z); }

// ---------- 天空、霧、光 ----------
const skyU = {top:{value:new T.Color('#8fbfd6')}, bot:{value:new T.Color('#f3ead2')}};
const sky = new T.Mesh(new T.SphereGeometry(900,32,16), new T.ShaderMaterial({
  uniforms:skyU, side:T.BackSide, depthWrite:false, fog:false,
  vertexShader:'varying vec3 p; void main(){ p=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(p,1.); }',
  fragmentShader:'uniform vec3 top; uniform vec3 bot; varying vec3 p; void main(){ float h=clamp(p.y/420.,0.,1.); gl_FragColor=vec4(mix(bot,top,pow(h,.6)),1.); }'
}));
scene.add(sky);
scene.fog = new T.Fog('#eadcb8', 80, 340);
const hemi = new T.HemisphereLight('#fff3dc', '#8a7a50', 0.9); scene.add(hemi);
const sun = new T.DirectionalLight('#fff3dc', 0.85);
sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
const sc = sun.shadow.camera; sc.left=-45; sc.right=45; sc.top=45; sc.bottom=-45; sc.near=10; sc.far=260;
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);

// ---------- 材質小工具 ----------
const mats = {};
function lam(c){ return mats[c] || (mats[c] = new T.MeshLambertMaterial({color:c})); }
function box(w,h,d,c,x,y,z,parent){ const m=new T.Mesh(new T.BoxGeometry(w,h,d),lam(c)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; (parent||scene).add(m); return m; }
function hipRoof(w,d,h,c){ const g=new T.ConeGeometry(Math.SQRT1_2,1,4,1); g.rotateY(Math.PI/4); g.scale(w*1.18,h,d*1.18); const m=new T.Mesh(g,lam(c)); m.castShadow=true; return m; }

// ---------- 地面（中間挖掉湖） ----------
const shape = new T.Shape(); shape.moveTo(-400,-400); shape.lineTo(400,-400); shape.lineTo(400,400); shape.lineTo(-400,400); shape.lineTo(-400,-400);
const hole = new T.Path(); hole.absellipse(0,0,RX,RZ,0,Math.PI*2,true,0); shape.holes.push(hole);
const gGeo = new T.ShapeGeometry(shape, 64); gGeo.rotateX(-Math.PI/2);
const ground = new T.Mesh(gGeo, lam('#b9b88e')); ground.position.y = 0.3; ground.receiveShadow = true; scene.add(ground);
// 湖岸和環湖步道
function ellRing(a,b,col,y){ const g=new T.RingGeometry(a,b,96); g.rotateX(-Math.PI/2); g.scale(RX,1,RZ); const m=new T.Mesh(g,lam(col)); m.position.y=y; m.receiveShadow=true; scene.add(m); }
ellRing(1.0,1.035,'#b59a62',0.32); ellRing(1.07,1.1,'#e2d4ae',0.33);
// 湖底（反射水面下的顏色）
const bed = new T.Mesh(new T.CircleGeometry(1,64).rotateX(-Math.PI/2).scale(RX,1,RZ), lam('#8fa89a')); bed.position.y=-1.5; scene.add(bed);

// ---------- 水面（真的會反射） ----------
const waterShader = {
  uniforms:{ color:{value:null}, tDiffuse:{value:null}, textureMatrix:{value:null}, time:{value:0}, tint:{value:new T.Color('#9fb9ae')} },
  vertexShader:'uniform mat4 textureMatrix; varying vec4 vUv; varying vec2 vP; void main(){ vUv=textureMatrix*vec4(position,1.); vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:[
    'uniform sampler2D tDiffuse; uniform float time; uniform vec3 tint; varying vec4 vUv; varying vec2 vP;',
    'void main(){',
    ' vec2 d=vec2(sin(vP.y*0.55+time*1.2)+sin(vP.x*0.23-time*0.8), cos(vP.x*0.47+time*1.0)+sin(vP.y*0.19+time*0.6))*0.0035;',
    ' vec4 uv=vUv; uv.xy+=d*uv.w;',
    ' vec3 r=texture2DProj(tDiffuse,uv).rgb;',
    ' float sp=0.;',
    ' gl_FragColor=vec4(mix(tint,r*vec3(.85,.95,1.),0.38)+sp,1.);',
    '}'].join('\n')
};
const wGeo = new T.CircleGeometry(1,96); wGeo.scale(RX,RZ,1);
const water = new T.Reflector(wGeo, {shader:waterShader, textureWidth:Math.round(innerWidth*DPR*0.6), textureHeight:Math.round(innerHeight*DPR*0.6), clipBias:0.003});
water.rotation.x = -Math.PI/2; water.position.y = 0; scene.add(water);

// ---------- 湖心島與歷下亭 ----------
const isl = new T.Mesh(new T.CylinderGeometry(ISL.r, ISL.r+0.8, 1.2, 28), lam('#b9b07a')); isl.position.set(ISL.x,-0.3,ISL.z); isl.receiveShadow=true; scene.add(isl);
const pav = new T.Group(); pav.position.set(ISL.x,0.3,ISL.z); scene.add(pav);
{ const base=new T.Mesh(new T.CylinderGeometry(3.4,3.6,0.6,8),lam('#d8cfbd')); base.position.y=0.3; base.receiveShadow=base.castShadow=true; pav.add(base);
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2+Math.PI/8; const c=new T.Mesh(new T.CylinderGeometry(0.18,0.18,3.2,6),lam('#a8432f')); c.position.set(Math.cos(a)*2.8,2.2,Math.sin(a)*2.8); c.castShadow=true; pav.add(c); }
  const eave=new T.Mesh(new T.ConeGeometry(4.6,0.9,8,1,true),new T.MeshLambertMaterial({color:'#2f5d6e',side:T.DoubleSide})); eave.position.y=4.0; eave.castShadow=true; pav.add(eave);
  const roof=new T.Mesh(new T.ConeGeometry(3.4,2.4,8),lam('#2f5d6e')); roof.position.y=5.2; roof.castShadow=true; pav.add(roof);
  const fin=new T.Mesh(new T.SphereGeometry(0.3,8,6),lam('#c9a24a')); fin.position.y=6.6; pav.add(fin);
  // 剝落的油漆：幾塊淡色補丁
  for(let i=0;i<5;i++){ const a=rnd()*Math.PI*2; const p=new T.Mesh(new T.BoxGeometry(0.4,0.5,0.05),lam('#d9b8a0')); p.position.set(Math.cos(a)*2.8,1.6+rnd(),Math.sin(a)*2.8); pav.add(p);} }
// 碼頭
box(3,0.3,1.4,'#8a6a46',ISL.x,0.25,ISL.z-ISL.r-0.4);

// ---------- 鐵公祠 ----------
const tie = new T.Group(); tie.position.set(60,0.3,40); tie.rotation.y = Math.PI+0.6; scene.add(tie);
{ // 圍牆
  box(22,2.2,0.6,'#d9d3c4',0,1.1,-8,tie); box(22,2.2,0.6,'#d9d3c4',0,1.1,8,tie); box(0.6,2.2,16,'#d9d3c4',-11,1.1,0,tie);
  box(0.6,2.2,6,'#d9d3c4',11,1.1,-5,tie); box(0.6,2.2,6,'#d9d3c4',11,1.1,5,tie);
  // 大門
  box(1.6,3,4,'#a8432f',11,1.5,0,tie); const gr=hipRoof(2.6,5,1.4,'#2f4f5e'); gr.position.set(11,3.7,0); tie.add(gr);
  // 享堂
  box(7,4,9,'#b5503c',-4,2,0,tie); const r=hipRoof(8.5,10.5,3.2,'#2f4f5e'); r.position.set(-4,5.6,0); tie.add(r);
  // 荷池
  const pond=new T.Mesh(new T.CircleGeometry(3,20).rotateX(-Math.PI/2),lam('#6f9c9c')); pond.position.set(5,0.05,4); tie.add(pond);
  for(let i=0;i<10;i++){ const l=new T.Mesh(new T.CircleGeometry(0.45,8).rotateX(-Math.PI/2),lam('#4f8a4f')); l.position.set(5+(rnd()-.5)*4.5,0.08,4+(rnd()-.5)*4.5); tie.add(l);}
  // 迴廊
  for(let i=0;i<6;i++) box(1.2,0.25,1.2,'#8a3a2a',2+i*1.3,2.4,-3.5,tie);
  box(8,0.3,1.6,'#2f4f5e',5.3,2.7,-3.5,tie);
}

// ---------- 古水仙祠（舊、有點歪） ----------
const shui = new T.Group(); shui.position.set(40,0.3,53); shui.rotation.y = 0; scene.add(shui);
{ box(9,3,4.5,'#a88a6a',0,1.5,0,shui); const r=hipRoof(10,5.5,2,'#6c6f68'); r.position.set(0,3.9,0); r.rotation.z=0.04; shui.add(r);
  box(1.4,2,0.1,'#4a3a2a',0,1,2.3,shui); box(3,0.7,0.12,'#7a6a52',0,2.6,2.35,shui); }

// ---------- 鵲華橋（南岸，跨過出水口） ----------
const bridge = new T.Group(); bridge.position.set(-30,0,-38.5); bridge.rotation.y = 0.55; scene.add(bridge);
{ const arch=new T.Mesh(new T.TorusGeometry(4.5,0.7,8,24,Math.PI),lam('#efece4')); arch.castShadow=true; bridge.add(arch);
  const deck=new T.Mesh(new T.TorusGeometry(4.5,0.25,4,24,Math.PI),lam('#c9c3b5')); deck.scale.set(1,1,4); deck.position.y=0.5; bridge.add(deck); }
// 出水的小河
const stream=new T.Mesh(new T.PlaneGeometry(9,40).rotateX(-Math.PI/2),lam('#9fb9ae')); stream.position.set(-40,0.31,-55); stream.rotation.y=0.55; scene.add(stream);

// ---------- 千佛山（南方遠山）：像青綠山水畫一樣，一層一層的山 ----------
function inst(geo,mat,list,sc,cast,parent){ const im=new T.InstancedMesh(geo,mat,list.length); const o=new T.Object3D();
  list.forEach((p,i)=>{ o.position.set(p[0],p[1],p[2]); const s=sc*(0.8+rnd()*0.5); o.scale.set(s,s,s); o.rotation.y=rnd()*6; o.updateMatrix(); im.setMatrixAt(i,o.matrix); }); if(cast) im.castShadow=true; (parent||scene).add(im); return im; }
// 一道山稜：上緣是起伏的山形，顏色由山頂（深青綠）漸變到山腳（淡赭、霧白）
function ridge(z,w,base,amp,pk,cTop,cBot,ph){ const N=200, top=[];
  for(let i=0;i<=N;i++){ const u=i/N, x=-w/2+u*w; let h=base+amp*(0.55*Math.sin(u*8.3+ph)+0.3*Math.sin(u*21.7+ph*2.1)+0.15*Math.sin(u*57+ph*3.3));
    for(const [px,ph2,pw] of pk){ const d=(x-px)/pw; h+=ph2*Math.exp(-d*d); } top.push([x,Math.max(1.5,h)]); }
  const pos=[], col=[], idx=[]; const ct=new T.Color(cTop), cb=new T.Color(cBot), c=new T.Color();
  top.forEach(([x,h],i)=>{ const n=(Math.sin(x*0.21)+Math.sin(x*0.067+1))*0.04;
    [[1,0],[0.55,0.45],[0,1]].forEach(([f,t])=>{ pos.push(x,h*f-1,0); c.copy(ct).lerp(cb,Math.pow(t,0.8)); c.offsetHSL(0,0,n*(1-t)); col.push(c.r,c.g,c.b); });

let AC=null; function ac(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(kind){ const a=ac(); if(!a) return; const t0=a.currentTime;
  if(kind==='ding'){ [880,1320].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0.12,t0+i*0.08); g.gain.exponentialRampToValueAtTime(0.001,t0+i*0.08+0.5); o.connect(g).connect(a.destination); o.start(t0+i*0.08); o.stop(t0+i*0.08+0.5); }); }

  if(kind==='song'){ const notes=[392,440,523,440,392,330,392]; notes.forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=f; const s=t0+i*0.32; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(0.09,s+0.05); g.gain.exponentialRampToValueAtTime(0.001,s+0.45); o.connect(g).connect(a.destination); o.start(s); o.stop(s+0.5); }); }
  if(kind==='rustle'){ for(let k=0;k<4;k++){ const len=0.12, buf=a.createBuffer(1,a.sampleRate*len,a.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=3000; const g=a.createGain(); g.gain.value=0.35; s.connect(f).connect(g).connect(a.destination); s.start(t0+k*0.22); } }

      const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g=a.createGain(); g.gain.value=0.9; s.connect(f).connect(g).connect(a.destination); s.start(t0+k*0.11); } }

let REV=null; function reverb(){ const a=ac(); if(!a) return null; if(REV) return REV;

  while(MUS.next<a.currentTime+1){ const t=MUS.next;

    if(MUS.beat%4===0) pluck([73.42,110,98,73.42][(MUS.beat/4)%4],t,0.07,MUS.bus);                         // 低音
    let dur=[1,1,1,2,2,3][Math.floor(Math.random()*6)];
    if(Math.random()<0.18 && MUS.beat%16>2){ dur=1; }                                                       // 休止
    else { MUS.idx=Math.max(3,Math.min(PENTA.length-1,MUS.idx+[-2,-1,-1,1,1,2,0][Math.floor(Math.random()*7)])); pluck(PENTA[MUS.idx],t,0.085,MUS.bus);
      if(dur>=2&&Math.random()<0.4) pluck(PENTA[MUS.idx],t+B*1.1,0.035,MUS.bus); }                            // 輕輕的回音
    MUS.next+=dur*B; MUS.beat+=dur; } }

// ---------- 兩步驟證據題：答對後再選「課文哪一句最能支持」（每次遊戲最多 6 題） ----------
function canEvidence(q){ if(!q._id||!q.hl||q.o.length<2||/^(word|task)\./.test(q._id)||evDone>=EV_MAX) return false;
  const quotes=(q.q.match(/「[^」]+」/g)||[]).map(x=>x.slice(1,-1)); if(quotes.some(x=>q.hl.includes(x)||x.includes(q.hl))) return false;  /* 題目已經引了這一句，就不再問證據 */
  return Math.random()<0.6; }
function evidenceOpts(q){ const p=paraOf(q.hl), seen=new Set([q.hl]), pool=[];
  Object.values(MH.BYID).forEach(x=>{ const h=x.hl; if(!h||seen.has(h)||h.length<5||paraOf(h)===p||paraOf(h)<0||h.includes(q.hl)||q.hl.includes(h)) return; seen.add(h); pool.push(h); });
  return shuffle(pool).slice(0,3); }
function ask(q){ wait(); const sp=q.w||'老殘'; who.textContent=sp+'考你'; setFace(sp); showActor(sp);
  const ev=canEvidence(q); if(ev) evDone++;
  let first=true, picked=null;
  const stage=(n,t)=>ev?'<span class="stage">第 '+n+' 步・'+t+'</span>':'';
  const clue=()=>{ if(CH.on){ quoteEl.innerHTML='<span class="qt">🔥 挑戰模式：沒有線索，靠自己！</span>'; return; }
    quoteEl.innerHTML='<button class="peek" type="button">📜 看課文線索</button>';
    quoteEl.querySelector('.peek').addEventListener('click',e=>{ e.stopPropagation(); openText(q.hl,ev); }); };
  const reveal=()=>{ quoteEl.innerHTML=quoteHtml(q.hl)+'<span class="src">「'+esc(q.hl)+'」</span>'; };
  const finish=()=>{ record(q,first,picked); goBtn(); };
  // 一組選項：答錯一次給方法提示、再試一次；第二次還錯就公布答案
  const round=(opts,tag,onRight,onFail,onTip)=>{ ch.innerHTML=''; let miss=0, right=null;
    shuffle(opts.map((o,i)=>({o,ok:i===0}))).forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.textContent=c.o; b.className='opt'; if(c.ok){ right=b; curRight=b; }
      b.addEventListener('click',e=>{ e.stopPropagation(); if(b.disabled) return;
        if(c.ok){ [...ch.children].forEach(x=>x.disabled=true); b.classList.add('right'); tone('ding'); onRight(); return; }
        b.disabled=true; b.classList.add('wrong'); tone('bad'); if(first){ first=false; picked=tag+c.o; }
        if(++miss>=2){ [...ch.children].forEach(x=>x.disabled=true); right.classList.add('right','shown'); onFail(); } else onTip(); });
      ch.appendChild(b); }); };
  const step2=()=>{ const d=evidenceOpts(q); if(d.length<3){ txt.innerHTML='<b class="ok">答對了！</b>'+esc(q.why||''); reveal(); return finish(); }
    const head=()=>'<b class="ok">判斷正確！</b>'+stage(2,'找證據')+'課文裡哪一句<b>最能支持</b>這個答案？';
    txt.innerHTML=head(); quoteEl.innerHTML='<span class="qt">答案：'+esc(q.o[0])+'</span>';
    round([q.hl,...d],'（證據）',
      ()=>{ txt.innerHTML='<b class="ok">證據也找對了！</b>'+esc(q.why||''); reveal(); finish(); },
      ()=>{ txt.innerHTML='<b class="bad">證據是這一句：</b>「'+esc(q.hl)+'」<br>'+esc(q.why||''); reveal(); finish(); },
      ()=>{ txt.innerHTML=head()+'<span class="method">💡 方法：把每一句和答案對照，找<b>直接寫到</b>答案內容的那一句；只是同一段、沒寫到重點的不算。</span><span class="tip">再試一次！</span>'; }); };
  const head1=()=>stage(1,'先判斷')+esc(q.q);
  txt.innerHTML=head1(); clue();
  round(q.o,'',
    ()=>{ if(ev) return step2(); txt.innerHTML='<b class="ok">答對了！</b>'+esc(q.why||''); reveal(); finish(); },
    ()=>{ txt.innerHTML='<b class="bad">沒關係，看正確答案：</b>'+esc(q.o[0])+'<br>'+esc(q.why||''); reveal(); finish(); },
    ()=>{ txt.innerHTML=head1()+'<span class="method">💡 方法：'+esc(methodTip(q))+(CH.on||ev?'':'<br>線索在課文這一句：「'+esc(q.hl)+'」')+'</span><span class="tip">再試一次！只剩一次機會。</span>'; }); }
