<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>國文考卷檢討</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div id="gate" class="wrap" hidden>
  <form class="gate" id="gform">
    <h1>國文考卷檢討</h1>
    <p class="sub">請輸入老師給的班級代碼</p>
    <input id="gcode" inputmode="numeric" autocomplete="off" aria-label="班級代碼">
    <button class="btn main" type="submit">進入</button>
    <p class="err" id="gerr"></p>
  </form>
</div>

<div id="list" class="wrap" hidden>
  <h1>國文考卷檢討</h1>
  <p class="sub">選一份要檢討的考試</p>
  <div class="exams" id="exams"></div>
</div>

<div id="home" class="wrap" hidden>
  <div class="top"><button class="back" id="toList">← 所有考試</button></div>
  <h1 id="etitle" style="margin-top:12px"></h1>
  <p class="sub" id="esub"></p>
  <div class="box">點你<strong>寫錯的題號</strong>，按「播放講解」就會一步一步講給你聽。題目上會用螢光筆標出重點，聽完記得按「我懂了」或「還是不懂」。</div>
  <div class="legend">
    <span><i style="border:1px solid var(--pen)"></i>有講解</span>
    <span><i style="background:var(--pen)"></i>我懂了</span>
    <span><i style="background:var(--red)"></i>還是不懂</span>
  </div>
  <div id="grids"></div>
</div>

<div id="view" hidden>
  <div class="wrap">
    <div class="top">
      <button class="back" id="back">← 回題號</button>
      <span class="tag" id="tag"></span>
    </div>
    <div id="vbox" hidden></div>
    <div class="paper" id="paper"></div>
    <div class="spacer"></div>
  </div>
  <div class="player">
    <div class="pin">
      <div class="cap" id="cap" aria-live="polite"></div>
      <div id="ctlWrap">
        <div class="dots" id="dots" style="margin-bottom:10px"></div>
        <div class="ctl">
          <button class="btn" id="prev">◀ 上一步</button>
          <button class="btn main" id="play">▶ 播放講解</button>
          <button class="btn" id="next">下一步 ▶</button>
          <div class="speed" id="voiceSel" hidden>聲音
            <button data-v="teacher">老師</button><button data-v="tts">電腦</button>
          </div>
          <div class="speed">語速
            <button data-r="0.8">慢</button><button data-r="1" aria-pressed="true">正常</button><button data-r="1.2">快</button>
          </div>
        </div>
      </div>
      <div class="end" id="end" hidden>
        <span class="ans">答案：<b id="ansv"></b></span>
        <button class="btn ok" id="iok">我懂了</button>
        <button class="btn no" id="ino">還是不懂</button>
        <button class="btn" id="again">再聽一次</button>
        <span class="note" id="endnote"></span>
      </div>
    </div>
  </div>
</div>

<script src="app.js?v=2"></script>
<script>studentApp();</script>
</body>
</html>
